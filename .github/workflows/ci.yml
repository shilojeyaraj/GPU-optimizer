name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytorch-autotune (lint + pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    defaults:
      run:
        working-directory: pytorch-autotune
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # CPU-only torch keeps CI under 5 min
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Ruff
        run: ruff check autotune/
      - name: Mypy (advisory)
        run: mypy autotune/ || true
      - name: Unit tests
        run: pytest tests/unit -v --cov=autotune --cov-report=xml
      - name: Integration smoke
        run: pytest tests/integration -v --no-cov
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: pytorch-autotune/coverage.xml
          flags: pytorch-autotune
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
