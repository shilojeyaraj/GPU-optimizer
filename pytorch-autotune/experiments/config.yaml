# Paper experiment search space — the 6 locked dimensions.
# See ../README.md (Phase 2.1 in the master plan) for the rationale on what was
# cut from the original 11-dim space.

search_space:
  batch_size: [8, 16, 32, 64, 128]
  precision: [fp32, fp16, bf16]
  compile_mode: [default, reduce-overhead, max-autotune]
  use_flash_attention: [true, false]
  gradient_accumulation_steps: [1, 2, 4]
  dataloader_workers: [0, 2, 4, 8]

constraints:
  max_vram_gb: 24       # default to RTX 4090; override per-run on bigger GPUs
  max_oom_retries: 0    # OOMs count as failed trials in the paper, no retry
  min_quality_ratio: 0.95

experiment:
  n_trials: 30
  repeats: 3
  seed: 42

baselines:
  - random
  - heuristic
  - optuna_tpe
  - llm_no_docs
  - llm_with_docs
